# ~/.config/tmux/tmux.conf — managed by chezmoi
# (edit with `chezmoi edit ~/.config/tmux/tmux.conf`, reload inside tmux with prefix r)
# Works with tmux 3.2+ (Ubuntu 22.04 ships 3.2a). No plugin manager: nothing to install.

# --- Prefix: Ctrl-a (press Ctrl-a twice to send a literal Ctrl-a to the program) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ---------------------------------------------------------------------
set -g mouse on                  # click panes/windows, drag borders, scroll
set -g history-limit 50000
set -g base-index 1              # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on       # close window 2 of 3 and 3 becomes 2
set -g display-time 2000
set -g set-titles on             # terminal tab title follows the window

# --- Neovim-friendly -------------------------------------------------------------
set -sg escape-time 10           # default 500ms makes Esc in nvim feel laggy
set -g focus-events on           # lets nvim reload files changed outside it
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true colour (24-bit) passthrough
set -as terminal-features ",*:usstyle"            # coloured undercurls for nvim diagnostics
set -g set-clipboard on          # copies reach the Windows/macOS clipboard via OSC 52

# --- Reload ----------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Splits & windows (open in the current directory) ---------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Panes: vim keys -------------------------------------------------------------
# Ctrl-h/j/k/l moves between tmux panes AND Neovim splits seamlessly (the Neovim
# half comes from the vim-tmux-navigator plugin). Inside nvim/fzf the keys pass through.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l           # Ctrl-l is taken, so prefix Ctrl-l clears the screen

# prefix + H/J/K/L resizes; after the first press, repeat H/J/K/L without the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode: vim keys (prefix [ to enter, v select, y copy, q quit) ----------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar: BMW palette (matches starship) ----------------------------------
#   light blue #81C4FF   dark blue #16588E   red #E7222E   thundernight #3B2754
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1c1c1c,fg=#81C4FF"
set -g status-left-length 30
set -g status-left "#[bg=#16588E,fg=#ffffff,bold] #S #[bg=#1c1c1c] "
set -g status-right "#{?client_prefix,#[bg=#E7222E#,fg=#ffffff#,bold] PREFIX #[default] ,}#[fg=#81C4FF]#H #[bg=#3B2754,fg=#ffffff] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#81C4FF,fg=#16588E,bold] #I:#W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#3B2754"
set -g pane-active-border-style "fg=#81C4FF"
set -g message-style "bg=#16588E,fg=#ffffff"
setw -g mode-style "bg=#16588E,fg=#ffffff"
